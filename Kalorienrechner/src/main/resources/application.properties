spring.application.name=todo.app
server.port=${PORT:8080}

# --- Datenbank: lokal H2, auf Render Postgres ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway soll die Tabellen erstellen
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate soll NICHT selbst Tabellen bauen
spring.jpa.hibernate.ddl-auto=validate

# H2-Konsole nur lokal
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# FatSecret
fatsecret.client-id=${FATSECRET_CLIENT_ID}
fatsecret.client-secret=${FATSECRET_CLIENT_SECRET}


app.jwt.secret=${JWT_SECRET:dev-secret-change-me}
